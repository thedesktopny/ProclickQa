<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skin Block</title>
<style>
  :root{ --bg:#0B0D14; --surface:#131623; --surface2:#1B1F2E; --border:#262B3D;
         --text:#F2F4FF; --text2:#AEB6E4; --text3:#7A84B8; --accent:#7B6CF6;
         --green:#10D48E; --red:#F24E4E; --yellow:#F5A623; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--text);
        font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  .wrap{ max-width:1280px; margin:0 auto; padding:26px 28px 60px; }
  .head{ margin-bottom:20px; }
  h1{ font-size:22px; margin:0 0 4px; letter-spacing:-.2px; }
  .sub{ color:var(--text3); font-size:13px; max-width:640px; }
  /* Inside the portal the page already has its own title bar. */
  .framed .head{ display:none; }
  .framed .wrap{ padding-top:20px; }

  .layout{ display:grid; grid-template-columns:290px minmax(0,1fr); gap:20px; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } .wrap{ padding:16px 16px 40px; } }

  /* ── settings panel ── */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:16px;
          padding:18px; position:sticky; top:20px; }
  @media (max-width:860px){ .panel{ position:static; } .main{ order:-1; } }
  .group{ padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--border); }
  .group:last-of-type{ border-bottom:0; margin-bottom:0; padding-bottom:4px; }
  .glabel{ font-size:11px; font-weight:600; letter-spacing:.7px; text-transform:uppercase;
           color:var(--text3); margin-bottom:10px; display:flex; justify-content:space-between; }
  .glabel span{ color:var(--text2); text-transform:none; letter-spacing:0; font-weight:500; }

  .choice{ display:block; cursor:pointer; margin-bottom:8px; }
  .choice:last-child{ margin-bottom:0; }
  .choice input{ position:absolute; opacity:0; pointer-events:none; }
  .choice .box{ display:block; border:1px solid var(--border); background:var(--surface2);
                border-radius:11px; padding:10px 12px; transition:border-color .15s, background .15s; }
  .choice .box b{ display:block; font-size:13.5px; font-weight:600; color:var(--text); }
  .choice .box i{ display:block; font-style:normal; font-size:12px; color:var(--text3); margin-top:1px; }
  .choice:hover .box{ border-color:#3a4160; }
  .choice input:checked + .box{ border-color:var(--accent); background:rgba(123,108,246,.14); }
  .choice input:focus-visible + .box{ outline:2px solid var(--accent); outline-offset:2px; }

  .toggle{ display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;
           font-size:13.5px; color:var(--text); }
  .toggle small{ display:block; color:var(--text3); font-size:12px; }
  .toggle input{ position:absolute; opacity:0; pointer-events:none; }
  .toggle .sw{ flex:none; width:38px; height:22px; border-radius:22px; background:var(--surface2);
               border:1px solid var(--border); position:relative; transition:background .15s, border-color .15s; }
  .toggle .sw::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
               border-radius:50%; background:var(--text3); transition:transform .15s, background .15s; }
  .toggle input:checked + .sw{ background:var(--accent); border-color:var(--accent); }
  .toggle input:checked + .sw::after{ transform:translateX(16px); background:#fff; }
  .toggle input:focus-visible + .sw{ outline:2px solid var(--accent); outline-offset:2px; }

  input[type=range]{ width:100%; accent-color:var(--accent); margin:0; display:block; }
  .hint{ font-size:12px; color:var(--text3); margin-top:6px; }
  select{ width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
          border-radius:10px; padding:9px 10px; font:inherit; font-size:13.5px; }
  select:focus{ outline:none; border-color:var(--accent); }

  .btn{ background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 16px;
        font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; transition:filter .15s, opacity .15s; }
  .btn:hover:not(:disabled){ filter:brightness(1.1); }
  .btn.outline{ background:transparent; border:1px solid var(--border); color:var(--text2); font-weight:500; }
  .btn.outline:hover:not(:disabled){ border-color:#3a4160; color:var(--text); filter:none; }
  .btn:disabled{ opacity:.4; cursor:default; }
  .actions{ display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:16px; }

  /* ── drop zone ── */
  .drop{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
         min-height:250px; border:2px dashed #343a55; border-radius:18px; padding:30px 20px;
         text-align:center; cursor:pointer; background:var(--surface);
         transition:border-color .15s, background .15s, min-height .2s; }
  .drop:hover{ border-color:var(--accent); }
  .drop.over{ border-color:var(--accent); background:rgba(123,108,246,.12); }
  .drop input{ display:none; }
  .drop .ico{ width:54px; height:54px; border-radius:50%; background:rgba(123,108,246,.16);
              color:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
  .drop .big{ font-size:17px; font-weight:600; color:var(--text); }
  .drop .small{ font-size:13px; color:var(--text3); }
  .drop .pick{ margin-top:10px; background:var(--accent); color:#fff; border-radius:10px;
               padding:9px 18px; font-size:13.5px; font-weight:600; }
  /* Once there are photos, the drop zone shrinks out of the way. */
  .main.has .drop{ min-height:0; flex-direction:row; padding:14px 18px; gap:12px; justify-content:flex-start; text-align:left; }
  .main.has .drop .ico{ width:36px; height:36px; margin:0; }
  .main.has .drop .ico svg{ width:18px; height:18px; }
  .main.has .drop .big{ font-size:14px; }
  .main.has .drop .small{ display:none; }
  .main.has .drop .pick{ margin:0 0 0 auto; padding:7px 14px; font-size:13px; }

  .status{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text2);
           margin:14px 2px; min-height:18px; }
  .status::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }
  .status:empty{ display:none; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .card canvas, .card img{ width:100%; display:block; background:#000; }
  .card .meta{ padding:9px 12px; font-size:12px; color:var(--text3); display:flex; justify-content:space-between; gap:8px; }
  .card .meta b{ color:var(--text2); font-weight:500; }
  .card.busy .meta b{ color:var(--yellow); } .card.done .meta b{ color:var(--green); } .card.fail .meta b{ color:var(--red); }
  .card.busy{ animation:pulse 1.4s ease-in-out infinite; }
  .card.check{ border-color:var(--yellow); } .card.check .meta b{ color:var(--yellow); }
  .card .ask{ padding:0 12px 12px; font-size:12px; color:var(--text2); line-height:1.5; }
  .card .ask div{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .card .ask button{ flex:1; min-width:120px; padding:8px 10px; border-radius:9px; border:1px solid var(--border);
                     background:var(--surface2); color:var(--text); font:inherit; cursor:pointer; }
  .card .ask button.cov{ background:#E5343D; border-color:#E5343D; color:#fff; }
  @keyframes pulse{ 50%{ border-color:#4a4570; } }
  @media (prefers-reduced-motion:reduce){ .card.busy{ animation:none; } *{ transition:none !important; } }
</style>
<script>if (window.top !== window.self) document.documentElement.classList.add('framed');</script>

<body>
<div class="wrap">
  <div class="head">
    <h1>Skin Block</h1>
    <div class="sub">Drop photos in. People are found, their skin is covered, and the pictures download
      themselves. Nothing leaves this computer.</div>
  </div>

  <div class="layout">
    <aside class="panel">
      <div class="group">
        <div class="glabel">What to cover</div>
        <label class="choice"><input type="radio" name="mode" value="skin" checked>
          <span class="box"><b>Skin only</b><i>Clothes stay visible</i></span></label>
        <label class="choice"><input type="radio" name="mode" value="person">
          <span class="box"><b>Whole person</b><i>Covers the full outline</i></span></label>
      </div>

      <div class="group">
        <label class="toggle"><span>Cover hair too<small>Off leaves hair as it is</small></span>
          <input type="checkbox" id="opt-hair"><span class="sw"></span></label>
      </div>

      <div class="group">
        <div class="glabel">Extra margin <span><span id="grow-v">6</span> px</span></div>
        <input type="range" id="opt-grow" min="0" max="24" value="6" aria-label="Extra margin around covered areas">
        <div class="hint">Higher covers a little past the edge of the skin.</div>
      </div>

      <div class="group">
        <div class="glabel">Cover style</div>
        <select id="opt-style" aria-label="Cover style">
          <option value="auto" selected>Auto colour — matches each picture</option>
          <option value="solid">Solid black</option><option value="#9a9a9a">Grey</option><option value="#ffffff">White</option>
          <option value="custom">Pick a colour…</option>
          <option value="blur">Blur</option><option value="pixel">Pixelate</option>
        </select>
        <input type="color" id="opt-colour" value="#7b6cf6" aria-label="Cover colour" style="display:none;width:30px;height:26px;border:0;background:none;padding:0;cursor:pointer;">
      </div>

      <div class="actions">
        <button class="btn" id="dl-all" disabled>Download all</button>
        <button class="btn outline" id="clear">Clear</button>
      </div>
    </aside>

    <section class="main" id="main">
      <label class="drop" id="drop">
        <input type="file" id="files" multiple accept="image/*,application/pdf,.pdf">
        <span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg></span>
        <span class="big">Drop photos or PDFs here</span>
        <span class="small">As many as you like. Finished pictures and PDFs download on their own.</span>
        <span class="pick">Choose photos or PDFs</span>
      </label>
      <div class="status" id="status">Loading the detectors…</div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>

<script>
  // Shrink the drop zone once there are photos, grow it back when cleared.
  new MutationObserver(function(){
    document.getElementById('main').classList.toggle('has', document.getElementById('grid').children.length > 0);
  }).observe(document.getElementById('grid'), { childList:true });
</script>

<script type="module">
/* ===========================================================================
   SKIN BLOCK, third design. Two models, each doing what it is good at.

   1. A person-segmentation model (YOLOv8n-seg, trained on real scenes at every
      scale) finds each person's OUTLINE. Reliable for a crowd of thumbnails
      and for one person filling the frame; no face needed; text, objects and
      backgrounds are never mistaken for people.
   2. MediaPipe's multiclass selfie model then looks at EACH PERSON up close —
      their crop enlarged to fill its frame, which is the scale it was built
      for — and labels skin and face. Skin inside the outline is covered;
      clothes and hair stay, so the picture remains readable.
   3. If the skin model finds almost nothing for someone, that person is
      covered whole. A safety net, not the default. But if the outline model
      is not very sure it is a person AND no face, hair or skin is seen (a
      dress on a hanger, a mannequin), the agent is shown it in red and asked
      — nothing is saved until they answer. PDF pages are covered to be safe.

   Earlier designs used one model for both jobs and were either ragged on
   crowds or blanketed group photos black. This split is what fixed both.
   =========================================================================== */
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.mjs";
import { FilesetResolver, ImageSegmenter }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";

const YOLO_URL = "/models/yolov8n-seg.onnx";
const SKIN_URL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";
const HAIR = 1, BODY = 2, FACE = 3;
const CONF = 0.25;          // below this the model starts seeing "people" in menu icons
const IOU = 0.6;             // overlapping people in a crowd are two people, not one
const FALLBACK_BELOW = 0.08; // skin found as a share of the person: under this, cover whole
const SURE_PERSON = 0.6;     // (only without the body check) this sure -> treat as a person
const POSE_URL = "/models/yolov8n-pose.onnx";
/* A small dedicated face finder (UltraFace, 1.6 MB). Every face it is sure of
   that the rest has not already covered gets covered — faces too small for the
   people models (a crowd, someone far away), and any face the skin model
   missed. Big pictures are also looked at in four overlapping parts so small
   faces are not lost when the picture is shrunk. */
const FACE_URL = "/models/ultraface-640.onnx";
const FACE_SURE = 0.8;
const FACE_SEEN = 0.85;      // body check: a nose / eye / ear this sure means a real person
/* ... or, with the head out of the picture, legs: knees and ankles on a body
   with shoulders. In tests a walking man cut off at the edge scored knees 0.95
   and ankles 0.76; clothes never above 0.38 and 0.09. */
const KNEE_SEEN = 0.7, ANKLE_SEEN = 0.5, SHOULDER_SEEN = 0.8;
const SMALL_SHAPE = 0.35;    // a person-shape shorter than this share of the picture is a person in a scene
const SKIN_SOME = 0.005;     // a body with no face showing this much skin: cover that skin only
/* Skin on a shape with NO face (clothes on a hanger, a product photo) is only
   believed when it is real skin by every measure: the skin model is sure of
   it, it is skin-coloured, and — unless the model is very sure — it reaches in
   from the edge of the picture or from outside the clothes, the way a hand
   holding a shirt does. Measured on real photos: real skin 0.81-0.89; the
   false "skin" the model sees on clothes (collars, neck openings, black
   sleeves and straps) 0.40-0.75, or not skin-coloured at all. */
const LOOSE_SURE = 0.80;     // skin this sure is believed anywhere
const LOOSE_EDGE = 0.70;     // ... this sure if it comes in from outside the clothes
const LOOSE_COLOUR = 0.6;    // share of its pixels that must be skin-coloured
/* Why the body check: the outline model is fooled by clothes — on product
   photos of shirts and dresses it scored up to 0.88 "person". The body-joint
   model finds a face on real people (0.98-1.00 in tests) and never above 0.76
   on clothes, so a shape with no face, no hair and no skin is clothing and is
   left alone. The agent can still cover it with one click. */
/* A dress on a hanger or a mannequin can look like a person to the outline
   model. When it is not very sure AND the skin model sees no face, hair or
   skin at all, the shape is not covered by itself: the agent is asked. */

const $ = id => document.getElementById(id);
const status = t => { $("status").textContent = t; };
let yolo = null, segmenter = null, poseNet = null, faceNet = null, queue = [], working = false, results = [];

/* ---- load ------------------------------------------------------------- */
async function boot(){
  try{
    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
    let backend = "webgpu";
    try{ yolo = await ort.InferenceSession.create(YOLO_URL, { executionProviders: ["webgpu"] }); }
    catch(e){ backend = "wasm"; yolo = await ort.InferenceSession.create(YOLO_URL, { executionProviders: ["wasm"] }); }
    try{ faceNet = await ort.InferenceSession.create(FACE_URL, { executionProviders: [backend] }); }
    catch(e){ try{ faceNet = await ort.InferenceSession.create(FACE_URL, { executionProviders: ["wasm"] }); }
              catch(e2){ faceNet = null; console.warn("face finder not loaded", e2); } }
    try{ poseNet = await ort.InferenceSession.create(POSE_URL, { executionProviders: [backend] }); }
    catch(e){ try{ poseNet = await ort.InferenceSession.create(POSE_URL, { executionProviders: ["wasm"] }); }
              catch(e2){ poseNet = null; console.warn("body check not loaded", e2); } }

    const files = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
    let delegate = "GPU";
    try{
      segmenter = await ImageSegmenter.createFromOptions(files, {
        baseOptions: { modelAssetPath: SKIN_URL, delegate }, runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: true });
    }catch(e){
      delegate = "CPU";
      segmenter = await ImageSegmenter.createFromOptions(files, {
        baseOptions: { modelAssetPath: SKIN_URL, delegate }, runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: true });
    }
    status((poseNet ? "" : "Body check not loaded — unsure shapes will be asked about. ")
           + "Ready — people on " + (backend === "webgpu" ? "the graphics card" : "the processor")
           + ", skin on " + (delegate === "GPU" ? "the graphics card" : "the processor") + ".");
  }catch(e){ status("The detectors could not load: " + e.message); }
}

/* ---- people: YOLO ------------------------------------------------------ */
/* Returns [{x1,y1,x2,y2, mask:Uint8Array(w*h)}] at image size. The model
   sees a letterboxed square; 640 for ordinary photos, 1280 when the image is
   large and may hold small figures — it is 4x the work, so only when needed. */
async function findPeople(img, w, h){
  const size = Math.max(w, h) > 1400 ? 1280 : 640;
  const scale = size / Math.max(w, h);
  const nw = Math.round(w * scale), nh = Math.round(h * scale);
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#727272"; ctx.fillRect(0, 0, size, size);       // YOLO's letterbox grey
  ctx.drawImage(img, 0, 0, nw, nh);
  const px = ctx.getImageData(0, 0, size, size).data;
  const input = new Float32Array(3 * size * size);
  for(let i = 0, n = size * size; i < n; i++){
    input[i] = px[i*4] / 255; input[n + i] = px[i*4+1] / 255; input[2*n + i] = px[i*4+2] / 255;
  }
  const out = await yolo.run({ images: new ort.Tensor("float32", input, [1, 3, size, size]) });
  const det = out.output0;               // [1, 116, N]  4 box + 80 classes + 32 mask coeffs
  const proto = out.output1;             // [1, 32, mh, mw]
  const N = det.dims[2], d = det.data;
  const mh = proto.dims[2], mw = proto.dims[3], pd = proto.data;

  // person is class 0 -> row 4
  const cands = [];
  for(let i = 0; i < N; i++){
    const score = d[4 * N + i];
    if(score < CONF) continue;
    const cx = d[i], cy = d[N + i], bw = d[2*N + i], bh = d[3*N + i];
    const coef = new Float32Array(32);
    for(let k = 0; k < 32; k++) coef[k] = d[(84 + k) * N + i];
    cands.push({ score, x1: cx - bw/2, y1: cy - bh/2, x2: cx + bw/2, y2: cy + bh/2, coef });
  }
  cands.sort((a, b) => b.score - a.score);
  const kept = [];
  for(const a of cands){
    let dup = false;
    for(const b of kept){
      const ix = Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1));
      const iy = Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
      const inter = ix * iy, ua = (a.x2-a.x1)*(a.y2-a.y1) + (b.x2-b.x1)*(b.y2-b.y1) - inter;
      if(inter / ua > IOU){ dup = true; break; }
    }
    if(!dup) kept.push(a);
  }

  // each mask = sigmoid(coef · prototypes), inside its box, back at image size
  const people = [];
  const ps = mw / size;                 // prototype grid per letterbox pixel
  const plane = mh * mw;
  for(const b of kept){
    const mask = new Uint8Array(w * h);
    const bx1 = Math.max(0, b.x1), by1 = Math.max(0, b.y1), bx2 = Math.min(nw, b.x2), by2 = Math.min(nh, b.y2);
    const ix1 = Math.max(0, Math.floor(bx1 / scale)), iy1 = Math.max(0, Math.floor(by1 / scale));
    const ix2 = Math.min(w, Math.ceil(bx2 / scale)), iy2 = Math.min(h, Math.ceil(by2 / scale));
    // the mask value on the model's coarse grid first, once per grid cell ...
    const gx1 = Math.max(0, Math.floor(ix1 * scale * ps) - 1), gx2 = Math.min(mw - 1, Math.ceil(ix2 * scale * ps) + 1);
    const gy1 = Math.max(0, Math.floor(iy1 * scale * ps) - 1), gy2 = Math.min(mh - 1, Math.ceil(iy2 * scale * ps) + 1);
    const gw = gx2 - gx1 + 1, logit = new Float32Array(gw * (gy2 - gy1 + 1));
    for(let gy = gy1; gy <= gy2; gy++) for(let gx = gx1; gx <= gx2; gx++){
      let v = 0; const o = gy * mw + gx;
      for(let k = 0; k < 32; k++) v += b.coef[k] * pd[k * plane + o];
      logit[(gy - gy1) * gw + (gx - gx1)] = v;
    }
    // ... then blended smoothly between cells, so the edge follows the shape
    // instead of stepping in square blocks
    const L = (gx, gy) => logit[(gy - gy1) * gw + (gx - gx1)];
    for(let y = iy1; y < iy2; y++){
      const fy = Math.min(gy2, Math.max(gy1, (y + 0.5) * scale * ps - 0.5));
      const y0 = Math.min(gy2 - 0, Math.floor(fy)), y1g = Math.min(gy2, y0 + 1), ty = fy - y0;
      for(let x = ix1; x < ix2; x++){
        const fx = Math.min(gx2, Math.max(gx1, (x + 0.5) * scale * ps - 0.5));
        const x0 = Math.floor(fx), x1g = Math.min(gx2, x0 + 1), tx = fx - x0;
        const v = (L(x0, y0) * (1 - tx) + L(x1g, y0) * tx) * (1 - ty)
                + (L(x0, y1g) * (1 - tx) + L(x1g, y1g) * tx) * ty;
        if(v > 0) mask[y * w + x] = 1;          // sigmoid(v) > 0.5  <=>  v > 0
      }
    }
    people.push({ x1: ix1, y1: iy1, x2: ix2, y2: iy2, mask, score: b.score });
  }
  return people;
}

/* ---- body check: is there a face on this shape? ------------------------- */
/* The shape is cut out with a margin, enlarged to the body model's square,
   and the face points (nose, eyes, ears) of the body that sits where the
   shape is are read. Returns the surest of the five, 0..1. */
async function faceOn(img, w, h, p){
  const pad = 0.15, bw = p.x2 - p.x1, bh = p.y2 - p.y1;
  const x1 = Math.max(0, p.x1 - pad*bw), y1 = Math.max(0, p.y1 - pad*bh);

  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#727272"; ctx.fillRect(0, 0, S, S);
  ctx.drawImage(img, x1, y1, cw, ch, 0, 0, Math.round(cw*k), Math.round(ch*k));
  const px = ctx.getImageData(0, 0, S, S).data, n = S * S, input = new Float32Array(3 * n);
  for(let i = 0; i < n; i++){ input[i] = px[i*4]/255; input[n+i] = px[i*4+1]/255; input[2*n+i] = px[i*4+2]/255; }
  const out = await poseNet.run({ images: new ort.Tensor("float32", input, [1, 3, S, S]) });

  const head = hn ? { x: x1 + hx / hn / k, y: y1 + hy / hn / k,

}

/* Is there really a face, hair or skin where the body model put the head? */
function headSeen(g, head){
  if(!g || !head) return false;
  let hit = 0, all = 0;
  const step = Math.max(1, head.r / 6);
  for(let dy = -head.r; dy <= head.r; dy += step) for(let dx = -head.r; dx <= head.r; dx += step){
    if(dx*dx + dy*dy > head.r*head.r) continue;
    const xx = head.x + dx - g.x1, yy = head.y + dy - g.y1;
    if(xx < 0 || yy < 0 || xx >= g.cw || yy >= g.ch) continue;
    const mx = Math.min(g.mw-1, Math.floor(xx * g.s * g.mw / 512)), my = Math.min(g.mhh-1, Math.floor(yy * g.s * g.mhh / 512));
    const k = g.cat[my * g.mw + mx]; all++;
    if(k === FACE || k === HAIR || k === BODY) hit++;
  }
  return all > 0 && hit >= 0.2 * all;
}

/* ---- faces ------------------------------------------------------------- */
async function facesIn(img, x0, y0, cw, ch){
  const W = 640, H = 480, k = Math.min(W / cw, H / ch);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, x0, y0, cw, ch, 0, 0, Math.round(cw * k), Math.round(ch * k));
  const px = ctx.getImageData(0, 0, W, H).data, n = W * H, input = new Float32Array(3 * n);
  for(let i = 0; i < n; i++){
    input[i] = (px[i*4] - 127) / 128; input[n + i] = (px[i*4+1] - 127) / 128; input[2*n + i] = (px[i*4+2] - 127) / 128;
  }
  const out = await faceNet.run({ input: new ort.Tensor("float32", input, [1, 3, H, W]) });
  const sc = out.scores.data, bx = out.boxes.data, N = out.scores.dims[1], found = [];
  for(let i = 0; i < N; i++){
    const conf = sc[i*2 + 1]; if(conf < FACE_SURE) continue;
    const fx1 = bx[i*4] * W / k, fy1 = bx[i*4+1] * H / k, fx2 = bx[i*4+2] * W / k, fy2 = bx[i*4+3] * H / k;
    if(fx2 - fx1 < 6 || fy2 - fy1 < 6) continue;
    found.push({ x1: x0 + fx1, y1: y0 + fy1, x2: x0 + fx2, y2: y0 + fy2, conf });
  }
  return found;
}
/* The face finder sometimes "sees" a face in an insect or a row of buttons.
   A face it reports is believed only if much of it is skin-coloured — or, in a
   black-and-white photo where colour says nothing, if it is very sure. */
function faceLooksReal(img, w, h, f, grey, people){
  if(grey){
    // colour says nothing here: only a very sure face on a person the people
    // model found counts (a grey insect fooled it otherwise)
    const cx = (f.x1 + f.x2) / 2, cy = (f.y1 + f.y2) / 2;
    return f.conf >= 0.95 && (people || []).some(p => cx >= p.x1 && cx <= p.x2 && cy >= p.y1 && cy <= p.y2);
  }
  const x1 = Math.max(0, Math.floor(f.x1)), y1 = Math.max(0, Math.floor(f.y1));
  const fw = Math.min(w, Math.ceil(f.x2)) - x1, fh = Math.min(h, Math.ceil(f.y2)) - y1;
  if(fw < 2 || fh < 2) return false;
  const px = img.getContext("2d", { willReadFrequently: true }).getImageData(x1, y1, fw, fh).data;
  let skin = 0;
  for(let i = 0; i < fw * fh; i++){
    const r = px[i*4], g = px[i*4+1], b = px[i*4+2], Y = 0.299*r + 0.587*g + 0.114*b;
    const cr = (r - Y) * 0.713 + 128, cb = (b - Y) * 0.564 + 128;
    if(cr >= 133 && cr <= 180 && cb >= 77 && cb <= 135 && Y > 25) skin++;
  }
  return skin >= 0.3 * fw * fh;
}
function isGreyPicture(img, w, h){
  const k = Math.min(1, 200 / Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const ctx = c.getContext("2d", { willReadFrequently: true }); ctx.drawImage(img, 0, 0, c.width, c.height);
  const px = ctx.getImageData(0, 0, c.width, c.height).data; let sat = 0;
  for(let i = 0; i < px.length; i += 4) sat += Math.max(px[i], px[i+1], px[i+2]) - Math.min(px[i], px[i+1], px[i+2]);
  return sat / (px.length / 4) < 8;
}
async function findFaces(img, w, h, people){
  if(!faceNet) return [];
  let all = await facesIn(img, 0, 0, w, h);
  // the picture again in overlapping parts, each enlarged to the finder's full
  // size — small faces (a crowd, people far away) only show up that way
  const grids = Math.max(w, h) > 1600 ? [2, 3] : [2];
  for(const g of grids){
    const tw = Math.round(w / g * 1.25), th = Math.round(h / g * 1.25);
    for(let gy = 0; gy < g; gy++) for(let gx = 0; gx < g; gx++){
      const ax = Math.round(gx * (w - tw) / Math.max(1, g - 1)), ay = Math.round(gy * (h - th) / Math.max(1, g - 1));
      all = all.concat(await facesIn(img, ax, ay, Math.min(tw, w - ax), Math.min(th, h - ay)));
    }
  }
  const grey = isGreyPicture(img, w, h);
  all = all.filter(f => faceLooksReal(img, w, h, f, grey, people));
  all.sort((a, b) => b.conf - a.conf);
  const keep = [];
  for(const f of all){
    const area = (f.x2 - f.x1) * (f.y2 - f.y1);
    if(keep.every(g => Math.max(0, Math.min(f.x2, g.x2) - Math.max(f.x1, g.x1)) *
                       Math.max(0, Math.min(f.y2, g.y2) - Math.max(f.y1, g.y1)) < 0.3 * area)) keep.push(f);
  }

}
function coverFace(mask, w, h, f){
  // an oval a little larger than the face box, so chin, ears and forehead go too
  const cx = (f.x1 + f.x2) / 2, cy = (f.y1 + f.y2) / 2 - 0.05 * (f.y2 - f.y1);
  const rx = 0.62 * (f.x2 - f.x1), ry = 0.68 * (f.y2 - f.y1);
  for(let y = Math.max(0, Math.floor(cy - ry)); y < Math.min(h, Math.ceil(cy + ry)); y++)
    for(let x = Math.max(0, Math.floor(cx - rx)); x < Math.min(w, Math.ceil(cx + rx)); x++){
      const dx = (x - cx) / rx, dy = (y - cy) / ry;
      if(dx*dx + dy*dy <= 1) mask[y*w + x] = 1;
    }
}

/* ---- skin inside one person: MediaPipe ---------------------------------- */
function skinInside(img, w, h, p, hair, strictMin){
  const pad = 0.12;
  const bw = p.x2 - p.x1, bh = p.y2 - p.y1;
  const x1 = Math.max(0, Math.floor(p.x1 - pad*bw)), x2 = Math.min(w, Math.ceil(p.x2 + pad*bw));
  const y1 = Math.max(0, Math.floor(p.y1 - pad*bh)), y2 = Math.min(h, Math.ceil(p.y2 + pad*bh));
  const cw = x2 - x1, ch = y2 - y1;
  const mask = new Uint8Array(w * h);
  mask.human = 0; mask.hair = 0;
  if(cw < 8 || ch < 8) return mask;
  const s = 512 / Math.max(cw, ch);
  const c = document.createElement("canvas"); c.width = 512; c.height = 512;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 512, 512);
  ctx.drawImage(img, x1, y1, cw, ch, 0, 0, Math.round(cw*s), Math.round(ch*s));
  const out = segmenter.segment(c);
  const cat = out.categoryMask.getAsUint8Array(), mw = out.categoryMask.width, mhh = out.categoryMask.height;
  // how sure the model is of skin at each point (body skin or face skin)
  let sure = null, prob = null;
  try{
    const cm = out.confidenceMasks;
    if(cm && cm[BODY] && cm[FACE]){
      const b = cm[BODY].getAsFloat32Array(), f = cm[FACE].getAsFloat32Array();
      const hr = hair && cm[HAIR] ? cm[HAIR].getAsFloat32Array() : null;
      sure = new Float32Array(b.length); prob = new Float32Array(b.length);
      for(let i = 0; i < b.length; i++){
        sure[i] = Math.max(b[i], f[i]);
        // what the model DECIDED is skin (its top answer), as 1 or 0 — only the
        // edge of that is re-drawn, so nothing it did not call skin can become
        // skin (its raw likelihood is middling on a brown horse, for one)
        const k = cat[i];
        prob[i] = (k === BODY || k === FACE || (hair && k === HAIR)) ? 1 : 0;
      }
    }
  }catch(e){ sure = null; prob = null; }
  out.close();
  // the skin model's answer is a coarse 256 x 256 grid; drawn straight onto a
  // big photo its edge is a staircase that leaves slivers of skin and spills
  // onto clothes. This follows the photo's own colour edges instead.
  const fine = prob ? edgeAwareSkin(img, x1, y1, cw, ch, s, prob, mw, mhh) : null;
  // Skin anywhere in the cut-out, then kept only where it is part of skin that
  // touches the shape. A hand on a shirt is inside the shirt's outline but the
  // arm it belongs to hangs outside it — the arm used to be cut off at the
  // outline. Skin that touches nothing (a stray patch in the background) is
  // still left alone.
  const skin = new Uint8Array(cw * ch), queue = new Int32Array(cw * ch);
  let qn = 0;
  for(let yy = 0; yy < ch; yy++){
    const my = Math.min(mhh-1, Math.floor(yy * s * mhh / 512));
    for(let xx = 0; xx < cw; xx++){
      const mx = Math.min(mw-1, Math.floor(xx * s * mw / 512));
      const k = cat[my * mw + mx];
      const i = (y1 + yy) * w + (x1 + xx), j = yy * cw + xx;
      const isSkin = fine ? fine[j] === 1 : (k === BODY || k === FACE || (hair && k === HAIR));
      if(p.mask[i] && (k === BODY || k === FACE || k === HAIR)) mask.human++;
      if(p.mask[i] && k === HAIR) mask.hair++;
      if(!isSkin) continue;
      skin[j] = 1;
      if(p.mask[i]){ skin[j] = 2; queue[qn++] = j; }          // inside the shape: a seed
    }
  }
  for(let q = 0; q < qn; q++){
    const j = queue[q], xx = j % cw, yy = (j - xx) / cw;
    mask[(y1 + yy) * w + (x1 + xx)] = 1;
    if(xx > 0      && skin[j-1] === 1){ skin[j-1] = 2; queue[qn++] = j-1; }
    if(xx < cw - 1 && skin[j+1] === 1){ skin[j+1] = 2; queue[qn++] = j+1; }
    if(yy > 0      && skin[j-cw] === 1){ skin[j-cw] = 2; queue[qn++] = j-cw; }
    if(yy < ch - 1 && skin[j+cw] === 1){ skin[j+cw] = 2; queue[qn++] = j+cw; }
  }
  mask.strict = strictSkin(img, w, h, p, x1, y1, cw, ch, s, cat, sure, mw, mhh, hair, strictMin, fine);
  mask.grid = { cat, mw, mhh, x1, y1, cw, ch, s };

/* Edge-aware skin. The model's skin decision is spread smoothly onto the
   photo's pixels and then pulled onto the photo's own edges with a guided
   filter (each small window fits the likelihood as a straight function of the
   brightness there, so it changes where the photo changes and stays flat where
   the photo is flat). A pixel is skin where the result is over one half. */
function edgeAwareSkin(img, x1, y1, cw, ch, s, prob, mw, mhh){
  const n = cw * ch;
  const px = img.getContext("2d", { willReadFrequently: true }).getImageData(x1, y1, cw, ch).data;
  const I = new Float32Array(n), P = new Float32Array(n);
  const gx = mw / 512 * s, gy = mhh / 512 * s;
  for(let yy = 0; yy < ch; yy++){
    const fy = Math.min(mhh - 1, Math.max(0, (yy + 0.5) * gy - 0.5)), y0 = Math.floor(fy), y1g = Math.min(mhh - 1, y0 + 1), ty = fy - y0;
    for(let xx = 0; xx < cw; xx++){
      const fx = Math.min(mw - 1, Math.max(0, (xx + 0.5) * gx - 0.5)), x0 = Math.floor(fx), x1g = Math.min(mw - 1, x0 + 1), tx = fx - x0;
      const j = yy * cw + xx;
      P[j] = (prob[y0*mw + x0] * (1 - tx) + prob[y0*mw + x1g] * tx) * (1 - ty)
           + (prob[y1g*mw + x0] * (1 - tx) + prob[y1g*mw + x1g] * tx) * ty;
      I[j] = (0.299 * px[j*4] + 0.587 * px[j*4+1] + 0.114 * px[j*4+2]) / 255;
    }
  }
  const r = Math.max(2, Math.round(0.008 * Math.max(cw, ch))), eps = 0.004;
  const box = (src) => {                         // mean over a (2r+1) square, from a summed-area table
    const W = cw + 1, S = new Float64Array(W * (ch + 1)), out = new Float32Array(n);
    for(let yy = 0; yy < ch; yy++){ let row = 0;
      for(let xx = 0; xx < cw; xx++){ row += src[yy*cw + xx]; S[(yy+1)*W + xx+1] = S[yy*W + xx+1] + row; } }
    for(let yy = 0; yy < ch; yy++){
      const a = Math.max(0, yy - r), b = Math.min(ch, yy + r + 1);
      for(let xx = 0; xx < cw; xx++){
        const l = Math.max(0, xx - r), rr = Math.min(cw, xx + r + 1);
        out[yy*cw + xx] = (S[b*W + rr] - S[a*W + rr] - S[b*W + l] + S[a*W + l]) / ((b - a) * (rr - l));
      }
    }
    return out;
  };
  const IP = new Float32Array(n), II = new Float32Array(n);
  for(let j = 0; j < n; j++){ IP[j] = I[j] * P[j]; II[j] = I[j] * I[j]; }
  const mI = box(I), mP = box(P), mIP = box(IP), mII = box(II);
  const A = new Float32Array(n), B = new Float32Array(n);
  for(let j = 0; j < n; j++){
    const v = mII[j] - mI[j] * mI[j];
    A[j] = (mIP[j] - mI[j] * mP[j]) / (v + eps);
    B[j] = mP[j] - A[j] * mI[j];
  }
  const mA = box(A), mB = box(B), skin = new Uint8Array(n);
  for(let j = 0; j < n; j++) if(mA[j] * I[j] + mB[j] > 0.5) skin[j] = 1;
  return skin;
}

/* The skin on a shape with no face, keeping only the patches that pass every
   test above. Patches a small gap apart (a bracelet across a wrist) count as
   one, so a hand and its arm are judged together. */
function strictSkin(img, w, h, p, x1, y1, cw, ch, s, cat, sure, mw, mhh, hair, strictMin, fine){
  const out = new Uint8Array(w * h);

  const n = cw * ch, skin = new Uint8Array(n), conf = new Float32Array(n);
  for(let yy = 0; yy < ch; yy++){
    const my = Math.min(mhh-1, Math.floor(yy * s * mhh / 512));
    for(let xx = 0; xx < cw; xx++){
      const mx = Math.min(mw-1, Math.floor(xx * s * mw / 512)), k = cat[my * mw + mx], j = yy*cw + xx;
      if(fine ? fine[j] === 1 : (k === BODY || k === FACE || (hair && k === HAIR))){ skin[j] = 1; conf[j] = sure[my * mw + mx]; }
    }
  }

  const joined = dilate(skin, cw, ch, Math.max(1, Math.round(0.02 * Math.max(cw, ch))));
  const lab = new Int32Array(n), queue = new Int32Array(n), keep = new Uint8Array(n);

    next++; let qn = 0, a = 0, cs = 0, col = 0, outside = 0, edge = false;
    lab[start] = next; queue[qn++] = start;
    for(let q = 0; q < qn; q++){

      if(skin[j]){

        const r = px[j*4], g = px[j*4+1], b = px[j*4+2], Y = 0.299*r + 0.587*g + 0.114*b;
        const cr = (r - Y) * 0.713 + 128, cb = (b - Y) * 0.564 + 128;
        if(cr >= 136 && cr <= 180 && cb >= 77 && cb <= 135) col++;

        if(!p.mask[iy * w + ix]) outside++;
        if(ix <= 1 || iy <= 1 || ix >= w - 2 || iy >= h - 2) edge = true;
      }
      if(xx > 0      && joined[j-1]  && !lab[j-1]) { lab[j-1] = next;  queue[qn++] = j-1; }
      if(xx < cw - 1 && joined[j+1]  && !lab[j+1]) { lab[j+1] = next;  queue[qn++] = j+1; }
      if(yy > 0      && joined[j-cw] && !lab[j-cw]){ lab[j-cw] = next; queue[qn++] = j-cw; }
      if(yy < ch - 1 && joined[j+cw] && !lab[j+cw]){ lab[j+cw] = next; queue[qn++] = j+cw; }

  return out;
}

/* ---- edges -------------------------------------------------------------- */
/* The skin model works on a coarse grid, so its edge wanders a few pixels off
   the real one — a shaded side of an arm is left showing, or the cover stops
   short of the fingertips. This walks the edge out pixel by pixel into
   anything that has the colour of the skin right next to it, never more than
   a short distance, so it hugs the real outline without spilling into the
   background. */
function refineEdges(mask, img, w, h, r, T){
  if(r <= 0) return mask;
  const px = img.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  let cur = mask;
  const steps = 3, rr = Math.max(1, Math.round(r / steps)), W = w + 1;
  for(let step = 0; step < steps; step++){
    // the local average colour of what is covered, from summed-area tables
    const S = [new Float64Array(W*(h+1)), new Float64Array(W*(h+1)), new Float64Array(W*(h+1))], C = new Float64Array(W*(h+1));
    for(let y = 0; y < h; y++){ let a = 0, b = 0, c = 0, k = 0;
      for(let x = 0; x < w; x++){ const i = y*w + x;
        if(cur[i]){ a += px[i*4]; b += px[i*4+1]; c += px[i*4+2]; k++; }
        const o = (y+1)*W + x+1, u = y*W + x+1;
        S[0][o] = S[0][u] + a; S[1][o] = S[1][u] + b; S[2][o] = S[2][u] + c; C[o] = C[u] + k; } }
    const ring = dilate(cur, w, h, rr), next = new Uint8Array(cur);
    const win = Math.max(3, rr * 3);
    for(let y = 0; y < h; y++){
      const ya = Math.max(0, y - win), yb = Math.min(h, y + win + 1);
      for(let x = 0; x < w; x++){
        const i = y*w + x; if(cur[i] || !ring[i]) continue;
        const xa = Math.max(0, x - win), xb = Math.min(w, x + win + 1);
        const box = t => t[yb*W + xb] - t[ya*W + xb] - t[yb*W + xa] + t[ya*W + xa];
        const k = box(C); if(k < 4) continue;
        const dr = px[i*4] - box(S[0])/k, dg = px[i*4+1] - box(S[1])/k, db = px[i*4+2] - box(S[2])/k;
        if(dr*dr + dg*dg + db*db < T*T) next[i] = 1;
      }
    }
    cur = next;
  }
  return cur;
}

/* The skin model often sees only part of a close-up hand — the fingers, not
   the palm. Each patch of hand found is followed outward into touching pixels
   of the same skin colour, so the rest of the hand and the arm are covered
   too. A patch that would grow to more than twice its size again is not
   following a hand any more but something skin-coloured behind it (a beige
   shirt, a wooden table), and is left as it was. */
function growSkin(mask, img, w, h, T, within, capTimes){
  const px = img.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  // how sharply the picture changes at each pixel: growth stops at an outline
  // (the edge of an arm against a beige sofa), so it cannot leak across one
  const lum = new Float32Array(w * h);
  for(let i = 0; i < w*h; i++) lum[i] = 0.299*px[i*4] + 0.587*px[i*4+1] + 0.114*px[i*4+2];
  const edge = new Uint8Array(w * h);
  for(let y = 1; y < h - 1; y++) for(let x = 1; x < w - 1; x++){
    const i = y*w + x;
    const gx = lum[i-w+1] + 2*lum[i+1] + lum[i+w+1] - lum[i-w-1] - 2*lum[i-1] - lum[i+w-1];
    const gy = lum[i+w-1] + 2*lum[i+w] + lum[i+w+1] - lum[i-w-1] - 2*lum[i-w] - lum[i-w+1];
    if(Math.abs(gx) + Math.abs(gy) > 90) edge[i] = 1;
  }
  const out = new Uint8Array(mask), seen = new Uint8Array(w * h), queue = new Int32Array(w * h);
  const skinCol = i => { const r = px[i*4], g = px[i*4+1], b = px[i*4+2], Y = 0.299*r + 0.587*g + 0.114*b;
    const cr = (r - Y) * 0.713 + 128, cb = (b - Y) * 0.564 + 128; return cr >= 136 && cr <= 180 && cb >= 77 && cb <= 135; };
  for(let start = 0; start < w*h; start++){
    if(!mask[start] || seen[start]) continue;
    // one patch of found skin, and its average colour
    let qn = 0, sr = 0, sg = 0, sb = 0; queue[qn++] = start; seen[start] = 1;
    for(let q = 0; q < qn; q++){
      const i = queue[q], x = i % w; sr += px[i*4]; sg += px[i*4+1]; sb += px[i*4+2];
      for(const j of [x > 0 ? i-1 : -1, x < w-1 ? i+1 : -1, i-w, i+w])
        if(j >= 0 && j < w*h && mask[j] && !seen[j]){ seen[j] = 1; queue[qn++] = j; }
    }
    const n = qn, mr = sr/n, mg = sg/n, mb = sb/n, patch = queue.slice(0, n);
    // follow it out into matching skin
    const added = []; let grown = 0, cap = n * (capTimes || 2);
    const fq = Array.from(patch);
    for(let q = 0; q < fq.length && grown <= cap; q++){
      const i = fq[q], x = i % w;
      for(const j of [x > 0 ? i-1 : -1, x < w-1 ? i+1 : -1, i-w, i+w]){
        if(j < 0 || j >= w*h || seen[j] || out[j] || edge[j] || (within && !within[j])) continue;
        const dr = px[j*4] - mr, dg = px[j*4+1] - mg, db = px[j*4+2] - mb;
        if(dr*dr + dg*dg + db*db < T*T && skinCol(j)){ seen[j] = 2; added.push(j); fq.push(j); grown++; }
      }
    }
    if(grown <= cap) for(const j of added) out[j] = 1;
    else for(const j of added) seen[j] = 0;            // spilled: undo, the patch stays as found
  }
  return out;
}

/* On a close-up the skin model's patch spills a little past the fingers onto
   the background; keep only what is skin-coloured, or right beside it. */
function trimToSkin(mask, img, w, h){
  const px = img.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const col = new Uint8Array(w * h);
  for(let i = 0; i < w*h; i++){
    if(!mask[i]) continue;
    const r = px[i*4], g = px[i*4+1], b = px[i*4+2], Y = 0.299*r + 0.587*g + 0.114*b;
    const cr = (r - Y) * 0.713 + 128, cb = (b - Y) * 0.564 + 128;
    if(cr >= 136 && cr <= 180 && cb >= 77 && cb <= 135) col[i] = 1;
  }
  const near = dilate(col, w, h, Math.max(2, Math.round(Math.min(w, h) / 200)));
  const out = new Uint8Array(w * h);
  for(let i = 0; i < w*h; i++) if(mask[i] && near[i]) out[i] = 1;
  return out;
}

/* ---- smooth, grow, cover ------------------------------------------------ */
/* Rounds off the stair-steps the models leave at their own resolution: each
   pixel takes the majority of its small neighbourhood. */
function smoothMask(mask, w, h, r){
  if(r <= 0) return mask;
  const W = w + 1, I = new Uint32Array(W * (h + 1));
  for(let y = 0; y < h; y++){ let row = 0;
    for(let x = 0; x < w; x++){ row += mask[y*w+x]; I[(y+1)*W + x+1] = I[y*W + x+1] + row; } }
  const out = new Uint8Array(w * h);
  for(let y = 0; y < h; y++){
    const a = Math.max(0, y - r), b = Math.min(h, y + r + 1);
    for(let x = 0; x < w; x++){
      const l = Math.max(0, x - r), rr = Math.min(w, x + r + 1);
      const sum = I[b*W + rr] - I[a*W + rr] - I[b*W + l] + I[a*W + l];
      if(sum * 2 > (b - a) * (rr - l)) out[y*w+x] = 1;
    }
  }
  return out;
}

function dilate(mask, w, h, r){
  if(r <= 0) return mask;
  const tmp = new Uint8Array(w*h), out = new Uint8Array(w*h);
  for(let y = 0; y < h; y++){ let run = 0;
    for(let x = 0; x < w + r; x++){ if(x < w && mask[y*w+x]) run = 2*r+1;
      if(run > 0 && x-r >= 0 && x-r < w) tmp[y*w+(x-r)] = 1; if(run > 0) run--; } }
  for(let x = 0; x < w; x++){ let run = 0;
    for(let y = 0; y < h + r; y++){ if(y < h && tmp[y*w+x]) run = 2*r+1;
      if(run > 0 && y-r >= 0 && y-r < h) out[(y-r)*w+x] = 1; if(run > 0) run--; } }
  return out;
}

/* The colour around the edges of the picture — usually its background — never
   sampling a person, nudged a little so the covered shape still reads. This is
   the default, so a grey studio photo gets grey covers and a purple one purple. */
function autoColour(d, w, h, mask){
  const ring = Math.max(4, Math.round(Math.min(w, h) * 0.04));
  const R = [], G = [], B = [];
  for(let y = 0; y < h; y += 2) for(let x = 0; x < w; x += 2){
    if(!(x < ring || x >= w - ring || y < ring || y >= h - ring)) continue;
    const i = y * w + x; if(mask[i]) continue;
    R.push(d[i*4]); G.push(d[i*4+1]); B.push(d[i*4+2]);
  }
  if(R.length < 20) return [154, 154, 154];
  const med = a => { a.sort((p, q) => p - q); return a[a.length >> 1]; };
  let c = [med(R), med(G), med(B)];
  const lum = 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
  if(lum > 200) c = c.map(v => v * 0.86);
  else if(lum > 120) c = c.map(v => v * 0.92);
  else if(lum < 45) c = c.map(v => v + 38);
  else c = c.map(v => v + 16);
  return c.map(v => Math.max(0, Math.min(255, Math.round(v))));
}
function hexRgb(hex){ const v = String(hex || "#000").replace("#", ""); return [0, 2, 4].map(i => parseInt(v.substr(i, 2), 16) || 0); }

function cover(img, w, h, mask, style){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const src = ctx.getImageData(0, 0, w, h);
  let alt = null, fill = [38, 40, 52];
  if(style === "auto") fill = autoColour(src.data, w, h, mask);
  else if(style === "custom") fill = hexRgb($("opt-colour").value);
  else if(String(style).startsWith("#")) fill = hexRgb(style);
  if(style === "blur" || style === "pixel"){
    const t = document.createElement("canvas"); t.width = w; t.height = h;
    const tc = t.getContext("2d");
    if(style === "blur"){ tc.filter = "blur(" + Math.max(12, Math.round(w/40)) + "px)"; tc.drawImage(img, 0, 0, w, h); }
    else{ const bk = Math.max(10, Math.round(w/45)); tc.imageSmoothingEnabled = false;
          tc.drawImage(img, 0, 0, w, h, 0, 0, Math.ceil(w/bk), Math.ceil(h/bk));
          tc.drawImage(t, 0, 0, Math.ceil(w/bk), Math.ceil(h/bk), 0, 0, w, h); }
    alt = tc.getImageData(0, 0, w, h).data;
  }
  const d = src.data;
  for(let i = 0; i < w*h; i++){
    if(!mask[i]) continue;
    if(alt){ d[i*4] = alt[i*4]; d[i*4+1] = alt[i*4+1]; d[i*4+2] = alt[i*4+2]; }
    else{ d[i*4] = fill[0]; d[i*4+1] = fill[1]; d[i*4+2] = fill[2]; }
  }
  ctx.putImageData(src, 0, 0);
  return c;
}

/* ---- one file ------------------------------------------------------------ */
async function processFile(file){
  const url = URL.createObjectURL(file);
  const pic = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
  URL.revokeObjectURL(url);
  return processPicture(pic, pic.naturalWidth, pic.naturalHeight, file.name);
}

/* Works on anything that can be drawn — a photo, or a PDF page rendered to a
   canvas. It is first drawn at the working size, so every step below reads
   the same pixels at the same scale (a very large photo used to be cropped
   from the wrong place when the skin step zoomed in on a person). */
async function processPicture(srcPic, sw, sh, name, askUnsure = true){
  const scale = Math.min(1, 2000 / Math.max(sw, sh));
  const w = Math.round(sw * scale), h = Math.round(sh * scale);
  const img = document.createElement("canvas"); img.width = w; img.height = h;
  img.getContext("2d").drawImage(srcPic, 0, 0, w, h);
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const hair = $("opt-hair").checked, grow = Number($("opt-grow").value);
  const began = performance.now();

  const people = await findPeople(img, w, h);
  let mask = new Uint8Array(w * h), unsureMask = null, whole = 0, unsure = 0, skipped = 0, handsOnClothes = 0, handMask = null, facesAdded = 0;
  const soft = Math.max(1, Math.round(Math.min(w, h) / 400));
  // Every shape is looked at first, and only then decided — a picture with
  // real people in it makes its other person-shapes people too (an umpire seen
  // from behind next to two players), while a product photo has none.
  const ev = [];
  if(poseNet) for(const p of people){
    let ps = 0; for(let i = 0; i < w*h; i++) ps += p.mask[i];
    const sk = skinInside(img, w, h, p, hair);
    let ss = 0; for(let i = 0; i < w*h; i++) ss += sk[i];
    const human = sk.human / Math.max(1, ps);
    const body = await faceOn(img, w, h, p);
    const headOK = headSeen(sk.grid, body.head);
    // a small figure in a scene is a person: clothes for sale fill the picture
    const small = (p.y2 - p.y1) < SMALL_SHAPE * h && (p.x2 - p.x1) * (p.y2 - p.y1) < 0.15 * w * h;
    const faceSeen = !body.printed && body.face >= FACE_SEEN && headOK;
    // seen from behind: an ear or the back of a head, with hair there, on shoulders
    const backOfHead = !body.printed && body.face >= 0.5 && headOK && body.shoulders >= SHOULDER_SEEN;
    // lots of face, hair or skin with no shoulders at all is a close-up (a hand,
    // a face filling the picture); on a body with shoulders but no head it is
    // more likely a print or a collar on clothes, so it does not count there
    const closeUp = !faceSeen && human >= FALLBACK_BELOW && body.shoulders < SHOULDER_SEEN;
    const own = !body.printed && (faceSeen || backOfHead || body.legs || small || closeUp);
    ev.push({ ps, sk, ss, human, body, faceSeen, own, closeUp });
  }
  const sceneHasPeople = ev.some(e => e.own);
  for(let pi = 0; pi < people.length; pi++){
    const p = people[pi], e = ev[pi];
    let m = p.mask, isUnsure = false, isClothes = false;
    let ps = 0; if(e) ps = e.ps; else for(let i = 0; i < w*h; i++) ps += p.mask[i];
    if(e){
      const { sk, ss, faceSeen } = e;
      const person = e.own || (sceneHasPeople && p.score >= 0.5 && !e.body.printed);
      const toHands = src => {            // skin of a body with no face: a hand or an arm
        handMask = handMask || new Uint8Array(w * h);
        let n = 0; for(let i = 0; i < w*h; i++) if(src[i]){ handMask[i] = 1; n++; }
        return n;
      };
      if(!person) isClothes = true;
      else if(mode !== "skin") { /* whole person */ }
      // a close-up hand: the skin model calls much of a palm "clothes", so the
      // skin it did find is followed out across the rest of the hand — inside
      // the hand's own outline only, and only into skin colours
      else if(e.closeUp){ toHands(trimToSkin(growSkin(sk, img, w, h, 48, p.mask, 8), img, w, h)); m = null; }
      else if(ss >= FALLBACK_BELOW * ps){                                // plenty of skin: cover the skin
        if(faceSeen) m = sk; else { toHands(sk); m = null; }
      }
      else if(!faceSeen && ss >= SKIN_SOME * ps){ toHands(sk); m = null; } // headless: just the skin that shows
      else whole++;                                                      // a person, no skin seen: whole
      if(isClothes && toHands(sk.strict)) handsOnClothes++;              // a real hand on clothes is covered
    }
    const sk = poseNet ? null : (mode === "skin" || p.score < SURE_PERSON ? skinInside(img, w, h, p, hair) : null);
    if(isClothes){
      skipped++;
      unsureMask = unsureMask || new Uint8Array(w * h);
      for(let i = 0; i < w*h; i++) if(p.mask[i]) unsureMask[i] = 1;
      continue;
    }
    if(sk){
      let ss = 0; for(let i = 0; i < w*h; i++) ss += sk[i];
      const human = sk.human / Math.max(1, ps);
      if(mode === "skin" && ss >= FALLBACK_BELOW * ps) m = sk;           // skin found: cover the skin
      else if(p.score >= SURE_PERSON || human >= FALLBACK_BELOW){ if(mode === "skin") whole++; }  // a person: whole
      else isUnsure = true;            // not sure it is a person, and no face, hair or skin seen
    }
    if(isUnsure){
      unsure++;
      if(!askUnsure){ for(let i = 0; i < w*h; i++) if(m[i]) mask[i] = 1; continue; }   // a PDF: stay safe, cover
      unsureMask = unsureMask || new Uint8Array(w * h);
      for(let i = 0; i < w*h; i++) if(m[i]) unsureMask[i] = 1;
      continue;
    }
    if(m) for(let i = 0; i < w*h; i++) if(m[i]) mask[i] = 1;
  }
  // Skin with no person outline around it at all — a hand holding a product,
  // a hand on its own, an arm reaching in. The outline model often finds no
  // person there, so the skin model also looks at the whole picture, and only
  // patches it is sure of (and that are skin-coloured) are believed.
  if(mode === "skin" && poseNet){
    const frame = { x1: 0, y1: 0, x2: w, y2: h, mask: new Uint8Array(w * h) };
    // in a picture that clearly has people in it, skin reaching in from the
    // edge is believed more easily (someone cut off at the bottom of a photo)
    const sk = skinInside(img, w, h, frame, hair, sceneHasPeople ? null : LOOSE_SURE);
    let n = 0; for(let i = 0; i < w*h; i++) if(sk.strict[i] && !mask[i]){ (handMask = handMask || new Uint8Array(w * h))[i] = 1; n++; }
    if(n > 0.0005 * w * h) handsOnClothes++;
  }
  // hands on clothes: the skin model is least exact there, so their edge is
  // walked out to the real outline (faces and people keep the model's edge —
  // walking it out would creep into blond hair, which is skin-coloured)
  if(handMask){
    handMask = growSkin(handMask, img, w, h, 42);
    handMask = refineEdges(handMask, img, w, h, Math.max(2, Math.round(Math.min(w, h) / 70)), 40);
    for(let i = 0; i < w*h; i++) if(handMask[i]) mask[i] = 1;
  }
  // faces the face finder is sure of and that are not covered yet
  try{
    for(const f of await findFaces(img, w, h, people)){
      let inF = 0, cov = 0;
      for(let y = Math.max(0, Math.floor(f.y1)); y < Math.min(h, Math.ceil(f.y2)); y++)
        for(let x = Math.max(0, Math.floor(f.x1)); x < Math.min(w, Math.ceil(f.x2)); x++){ inF++; cov += mask[y*w + x]; }
      if(inF && cov < 0.6 * inF){ coverFace(mask, w, h, f); facesAdded++; }
    }
  }catch(e){ console.warn("face finder", e); }
  mask = dilate(smoothMask(mask, w, h, soft), w, h, grow);
  if(unsureMask) unsureMask = dilate(smoothMask(unsureMask, w, h, soft), w, h, grow);
  let covered = 0; for(let i = 0; i < mask.length; i++) covered += mask[i];
  const style = $("opt-style").value;
  const out = cover(img, w, h, mask, style);
  const r = { canvas: out, ms: Math.round(performance.now() - began), pct: Math.round(100*covered/mask.length),
              people: people.length - skipped - (askUnsure ? unsure : 0), whole,
              unsure: askUnsure ? unsure : 0, skipped, hands: handsOnClothes, name };
  if(r.unsure || r.skipped){
    // kept so the agent's "cover it too" can redo the picture without the models
    r.coverAll = () => {
      const both = new Uint8Array(w * h);
      let n = 0; for(let i = 0; i < w*h; i++){ both[i] = mask[i] | unsureMask[i]; n += both[i]; }
      r.pct = Math.round(100 * n / (w*h));
      r.canvas = cover(img, w, h, both, style); r.unsure = 0; r.people += r.skipped; r.skipped = 0; return r.canvas;
    };
    // what the agent looks at: the covered picture with the doubtful shape tinted red
    r.preview = () => {
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d"); ctx.drawImage(out, 0, 0);
      const d = ctx.getImageData(0, 0, w, h), px = d.data;
      for(let i = 0; i < w*h; i++) if(unsureMask[i] && !mask[i]){
        px[i*4] = Math.round(px[i*4] * 0.45 + 229 * 0.55);
        px[i*4+1] = Math.round(px[i*4+1] * 0.45 + 52 * 0.55);
        px[i*4+2] = Math.round(px[i*4+2] * 0.45 + 61 * 0.55);
      }
      ctx.putImageData(d, 0, 0); return c;
    };
  }
  return r;
}

/* ---- PDFs: every page is turned into a picture, covered, and put back
   together as a new PDF. The covering is burned into the page, so nothing
   underneath can be copied out of the file afterwards. -------------------- */
let pdfjs = null, jsPDFLib = null;
async function pdfTools(){
  if(!pdfjs){
    pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs";
  }
  if(!jsPDFLib){
    await new Promise((ok, no) => { const t = document.createElement("script");
      t.src = "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"; t.crossOrigin = "anonymous";
      t.onload = ok; t.onerror = () => no(new Error("could not load the PDF writer")); document.head.appendChild(t); });
    jsPDFLib = window.jspdf.jsPDF;
  }
}
async function processPdf(file, onPage){
  await pdfTools();
  const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
  if(doc.numPages > 40) throw new Error("more than 40 pages — split it first");
  let pdf = null, first = null, people = 0, ms = 0, skipped = 0;
  for(let n = 1; n <= doc.numPages; n++){
    onPage(n, doc.numPages);
    const page = await doc.getPage(n);
    const v1 = page.getViewport({ scale: 1 });                     // size in points
    const sc = Math.min(3, 2000 / Math.max(v1.width, v1.height));  // sharp, not huge
    const vp = page.getViewport({ scale: sc });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const r = await processPicture(c, c.width, c.height, file.name, false);
    people += r.people; ms += r.ms; skipped += r.skipped || 0; if(!first) first = r.canvas;
    const orient = v1.width > v1.height ? "l" : "p";
    if(!pdf) pdf = new jsPDFLib({ orientation: orient, unit: "pt", format: [v1.width, v1.height] });
    else pdf.addPage([v1.width, v1.height], orient);
    pdf.addImage(r.canvas.toDataURL("image/jpeg", 0.9), "JPEG", 0, 0, v1.width, v1.height);
  }
  return { canvas: first, pdfBlob: pdf.output("blob"), pages: doc.numPages, people, ms, pct: null,
           whole: 0, skipped, name: file.name };
}

/* ---- queue -------------------------------------------------------------- */
function addFiles(list){
  for(const f of list){
    const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
    if(!f.type.startsWith("image/") && !isPdf) continue;
    const card = document.createElement("div"); card.className = "card busy";
    card.innerHTML = '<div style="aspect-ratio:4/3;background:var(--surface2);"></div>'
      + '<div class="meta"><span>' + esc(f.name) + '</span><b>waiting</b></div>';
    $("grid").prepend(card); queue.push({ file: f, card, isPdf });
  }
  pump();
}
async function pump(){
  if(working) return; working = true;
  while(queue.length){
    const { file, card, isPdf } = queue.shift();
    if(!yolo || !segmenter){ card.querySelector("b").textContent = "detectors not loaded"; card.className = "card fail"; continue; }
    card.querySelector("b").textContent = "covering…";
    // let the page draw "covering…" (and answer clicks) before the heavy work starts
    await new Promise(r => setTimeout(r, 30));
    try{
      const r = isPdf
        ? await processPdf(file, (n, all) => { card.querySelector("b").textContent = "page " + n + " of " + all + "…"; })
        : await processFile(file);
      const label = () => (isPdf ? "PDF · " + r.pages + (r.pages === 1 ? " page · " : " pages · ") : "")
        + r.people + (r.people === 1 ? " person" : " people")
        + (r.whole ? " (" + r.whole + " whole)" : "") + (r.pct != null ? " · " + r.pct + "%" : "")
        + (r.skipped ? " · " + r.skipped + " clothes left" : "") + (r.hands && r.skipped ? " · hand covered" : "") + " · " + r.ms + " ms";
      if(r.unsure){
        // not saved yet: the agent decides about the shape in red
        card.replaceChild(r.preview(), card.firstChild);
        card.querySelector("b").textContent = "check this one";
        card.className = "card check";
        const ask = document.createElement("div"); ask.className = "ask";
        ask.innerHTML = "The part in <b style='color:#FF6B72'>red</b> might be a person, or might be just "
          + "clothes or an object. Is it a person?"
          + "<div><button class='cov'>Yes — cover it</button><button class='keep'>No — leave it</button></div>";
        card.appendChild(ask);
        const done = () => { ask.remove(); card.replaceChild(r.canvas, card.firstChild);
          card.querySelector("b").textContent = label(); card.className = "card done";
          results.push(r); autoDownload(r); $("dl-all").disabled = false; };
        ask.querySelector(".cov").onclick = () => { r.coverAll(); r.people++; done(); };
        ask.querySelector(".keep").onclick = () => { r.unsure = 0; done(); };
      }else if(r.skipped && !isPdf){
        card.replaceChild(r.canvas, card.firstChild);
        card.querySelector("b").textContent = label();
        card.className = "card done"; results.push(r); autoDownload(r);
        const note = document.createElement("div"); note.className = "ask";
        note.innerHTML = "Left uncovered: " + r.skipped + (r.skipped === 1 ? " shape that looks" : " shapes that look")
          + " like clothes, not a person" + (r.hands ? " — the hand holding it is covered." : " (no face, hair or skin).")
          + "<div><button class='cov'>Cover it anyway</button></div>";
        card.appendChild(note);
        note.querySelector(".cov").onclick = () => {
          r.coverAll(); card.replaceChild(r.canvas, card.firstChild);
          card.querySelector("b").textContent = label(); note.remove(); autoDownload(r);
        };
      }else{
        card.replaceChild(r.canvas, card.firstChild);
        card.querySelector("b").textContent = label();
        card.className = "card done"; results.push(r); autoDownload(r);
      }
    }catch(e){ card.querySelector("b").textContent = "failed: " + e.message; card.className = "card fail"; }
    status(results.length + " done" + (queue.length ? ", " + queue.length + " waiting" : ""));
  }
  $("dl-all").disabled = results.length === 0; working = false;
}
function autoDownload(r){
  if(r.pdfBlob){
    const a = document.createElement("a"); a.href = URL.createObjectURL(r.pdfBlob);
    a.download = r.name.replace(/\.[^.]+$/, "") + "-covered.pdf"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); return;
  }
  r.canvas.toBlob(blob => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = r.name.replace(/\.[^.]+$/, "") + "-covered.jpg"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, "image/jpeg", 0.92);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("files").addEventListener("change", e => addFiles(e.target.files));
try{ const st = localStorage.getItem("sb3_style"), cl = localStorage.getItem("sb3_colour");
     if(st && [...$("opt-style").options].some(o => o.value === st)) $("opt-style").value = st;
     if(cl) $("opt-colour").value = cl; }catch(e){}
const showPick = () => { $("opt-colour").style.display = $("opt-style").value === "custom" ? "" : "none"; };
showPick();
$("opt-style").addEventListener("change", () => { showPick(); try{ localStorage.setItem("sb3_style", $("opt-style").value); }catch(e){}
                                                   if($("opt-style").value === "custom") $("opt-colour").click(); });
$("opt-colour").addEventListener("input", () => { try{ localStorage.setItem("sb3_colour", $("opt-colour").value); }catch(e){} });
// a file dropped outside the drop area must not open in place of the page
["dragover", "drop"].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); }));
window.addEventListener("drop", e => { if(!$("drop").contains(e.target) && e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files); });
$("drop").addEventListener("dragover", e => { e.preventDefault(); $("drop").classList.add("over"); });
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("over"));
$("drop").addEventListener("drop", e => { e.preventDefault(); $("drop").classList.remove("over"); addFiles(e.dataTransfer.files); });
document.addEventListener("paste", e => { if(e.clipboardData?.files?.length) addFiles(e.clipboardData.files); });
$("opt-grow").addEventListener("input", e => { $("grow-v").textContent = e.target.value; });
$("clear").addEventListener("click", () => { $("grid").innerHTML = ""; results = []; $("dl-all").disabled = true; });
$("dl-all").addEventListener("click", () => results.forEach(autoDownload));
boot();
</script>

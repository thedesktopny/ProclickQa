<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skin Block</title>
<style>
  :root{ --bg:#0B0D14; --surface:#131623; --surface2:#1B1F2E; --border:#262B3D;
         --text:#F2F4FF; --text2:#AEB6E4; --text3:#7A84B8; --accent:#7B6CF6;
         --green:#10D48E; --red:#F24E4E; --yellow:#F5A623; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--text);
        font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  .wrap{ max-width:1280px; margin:0 auto; padding:26px 28px 60px; }
  .head{ margin-bottom:20px; }
  h1{ font-size:22px; margin:0 0 4px; letter-spacing:-.2px; }
  .sub{ color:var(--text3); font-size:13px; max-width:640px; }
  /* Inside the portal the page already has its own title bar. */
  .framed .head{ display:none; }
  .framed .wrap{ padding-top:20px; }

  .layout{ display:grid; grid-template-columns:290px minmax(0,1fr); gap:20px; align-items:start; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } .wrap{ padding:16px 16px 40px; } }

  /* ── settings panel ── */
  .panel{ background:var(--surface); border:1px solid var(--border); border-radius:16px;
          padding:18px; position:sticky; top:20px; }
  @media (max-width:860px){ .panel{ position:static; } .main{ order:-1; } }
  .group{ padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--border); }
  .group:last-of-type{ border-bottom:0; margin-bottom:0; padding-bottom:4px; }
  .glabel{ font-size:11px; font-weight:600; letter-spacing:.7px; text-transform:uppercase;
           color:var(--text3); margin-bottom:10px; display:flex; justify-content:space-between; }
  .glabel span{ color:var(--text2); text-transform:none; letter-spacing:0; font-weight:500; }

  .choice{ display:block; cursor:pointer; margin-bottom:8px; }
  .choice:last-child{ margin-bottom:0; }
  .choice input{ position:absolute; opacity:0; pointer-events:none; }
  .choice .box{ display:block; border:1px solid var(--border); background:var(--surface2);
                border-radius:11px; padding:10px 12px; transition:border-color .15s, background .15s; }
  .choice .box b{ display:block; font-size:13.5px; font-weight:600; color:var(--text); }
  .choice .box i{ display:block; font-style:normal; font-size:12px; color:var(--text3); margin-top:1px; }
  .choice:hover .box{ border-color:#3a4160; }
  .choice input:checked + .box{ border-color:var(--accent); background:rgba(123,108,246,.14); }
  .choice input:focus-visible + .box{ outline:2px solid var(--accent); outline-offset:2px; }

  .toggle{ display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer;
           font-size:13.5px; color:var(--text); }
  .toggle small{ display:block; color:var(--text3); font-size:12px; }
  .toggle input{ position:absolute; opacity:0; pointer-events:none; }
  .toggle .sw{ flex:none; width:38px; height:22px; border-radius:22px; background:var(--surface2);
               border:1px solid var(--border); position:relative; transition:background .15s, border-color .15s; }
  .toggle .sw::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px;
               border-radius:50%; background:var(--text3); transition:transform .15s, background .15s; }
  .toggle input:checked + .sw{ background:var(--accent); border-color:var(--accent); }
  .toggle input:checked + .sw::after{ transform:translateX(16px); background:#fff; }
  .toggle input:focus-visible + .sw{ outline:2px solid var(--accent); outline-offset:2px; }

  input[type=range]{ width:100%; accent-color:var(--accent); margin:0; display:block; }
  .hint{ font-size:12px; color:var(--text3); margin-top:6px; }
  select{ width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
          border-radius:10px; padding:9px 10px; font:inherit; font-size:13.5px; }
  select:focus{ outline:none; border-color:var(--accent); }

  .btn{ background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 16px;
        font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; transition:filter .15s, opacity .15s; }
  .btn:hover:not(:disabled){ filter:brightness(1.1); }
  .btn.outline{ background:transparent; border:1px solid var(--border); color:var(--text2); font-weight:500; }
  .btn.outline:hover:not(:disabled){ border-color:#3a4160; color:var(--text); filter:none; }
  .btn:disabled{ opacity:.4; cursor:default; }
  .actions{ display:grid; grid-template-columns:1fr auto; gap:8px; margin-top:16px; }

  /* ── drop zone ── */
  .drop{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
         min-height:250px; border:2px dashed #343a55; border-radius:18px; padding:30px 20px;
         text-align:center; cursor:pointer; background:var(--surface);
         transition:border-color .15s, background .15s, min-height .2s; }
  .drop:hover{ border-color:var(--accent); }
  .drop.over{ border-color:var(--accent); background:rgba(123,108,246,.12); }
  .drop input{ display:none; }
  .drop .ico{ width:54px; height:54px; border-radius:50%; background:rgba(123,108,246,.16);
              color:var(--accent); display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
  .drop .big{ font-size:17px; font-weight:600; color:var(--text); }
  .drop .small{ font-size:13px; color:var(--text3); }
  .drop .pick{ margin-top:10px; background:var(--accent); color:#fff; border-radius:10px;
               padding:9px 18px; font-size:13.5px; font-weight:600; }
  /* Once there are photos, the drop zone shrinks out of the way. */
  .main.has .drop{ min-height:0; flex-direction:row; padding:14px 18px; gap:12px; justify-content:flex-start; text-align:left; }
  .main.has .drop .ico{ width:36px; height:36px; margin:0; }
  .main.has .drop .ico svg{ width:18px; height:18px; }
  .main.has .drop .big{ font-size:14px; }
  .main.has .drop .small{ display:none; }
  .main.has .drop .pick{ margin:0 0 0 auto; padding:7px 14px; font-size:13px; }

  .status{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text2);
           margin:14px 2px; min-height:18px; }
  .status::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }
  .status:empty{ display:none; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .card canvas, .card img{ width:100%; display:block; background:#000; }
  .card .meta{ padding:9px 12px; font-size:12px; color:var(--text3); display:flex; justify-content:space-between; gap:8px; }
  .card .meta b{ color:var(--text2); font-weight:500; }
  .card.busy .meta b{ color:var(--yellow); } .card.done .meta b{ color:var(--green); } .card.fail .meta b{ color:var(--red); }
  .card.busy{ animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse{ 50%{ border-color:#4a4570; } }
  @media (prefers-reduced-motion:reduce){ .card.busy{ animation:none; } *{ transition:none !important; } }
</style>
<script>if (window.top !== window.self) document.documentElement.classList.add('framed');</script>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Skin Block</h1>
    <div class="sub">Drop photos in. People are found, their skin is covered, and the pictures download
      themselves. Nothing leaves this computer.</div>
  </div>

  <div class="layout">
    <aside class="panel">
      <div class="group">
        <div class="glabel">What to cover</div>
        <label class="choice"><input type="radio" name="mode" value="skin" checked>
          <span class="box"><b>Skin only</b><i>Clothes stay visible</i></span></label>
        <label class="choice"><input type="radio" name="mode" value="person">
          <span class="box"><b>Whole person</b><i>Covers the full outline</i></span></label>
      </div>

      <div class="group">
        <label class="toggle"><span>Cover hair too<small>Off leaves hair as it is</small></span>
          <input type="checkbox" id="opt-hair"><span class="sw"></span></label>
      </div>

      <div class="group">
        <div class="glabel">Extra margin <span><span id="grow-v">6</span> px</span></div>
        <input type="range" id="opt-grow" min="0" max="24" value="6" aria-label="Extra margin around covered areas">
        <div class="hint">Higher covers a little past the edge of the skin.</div>
      </div>

      <div class="group">
        <div class="glabel">Cover style</div>
        <select id="opt-style" aria-label="Cover style">
          <option value="solid">Solid black</option><option value="blur">Blur</option><option value="pixel">Pixelate</option>
        </select>
      </div>

      <div class="actions">
        <button class="btn" id="dl-all" disabled>Download all</button>
        <button class="btn outline" id="clear">Clear</button>
      </div>
    </aside>

    <section class="main" id="main">
      <label class="drop" id="drop">
        <input type="file" id="files" multiple accept="image/*">
        <span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg></span>
        <span class="big">Drop photos here</span>
        <span class="small">As many as you like. Finished pictures download on their own.</span>
        <span class="pick">Choose photos</span>
      </label>
      <div class="status" id="status">Loading the detectors…</div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>

<script>
  // Shrink the drop zone once there are photos, grow it back when cleared.
  new MutationObserver(function(){
    document.getElementById('main').classList.toggle('has', document.getElementById('grid').children.length > 0);
  }).observe(document.getElementById('grid'), { childList:true });
</script>

<script type="module">
/* ===========================================================================
   SKIN BLOCK, third design. Two models, each doing what it is good at.

   1. A person-segmentation model (YOLOv8n-seg, trained on real scenes at every
      scale) finds each person's OUTLINE. Reliable for a crowd of thumbnails
      and for one person filling the frame; no face needed; text, objects and
      backgrounds are never mistaken for people.
   2. MediaPipe's multiclass selfie model then looks at EACH PERSON up close —
      their crop enlarged to fill its frame, which is the scale it was built
      for — and labels skin and face. Skin inside the outline is covered;
      clothes and hair stay, so the picture remains readable.
   3. If the skin model finds almost nothing for someone, that person is
      covered whole. A safety net, not the default.

   Earlier designs used one model for both jobs and were either ragged on
   crowds or blanketed group photos black. This split is what fixed both.
   =========================================================================== */
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.webgpu.mjs";
import { FilesetResolver, ImageSegmenter }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21";

const YOLO_URL = "/models/yolov8n-seg.onnx";
const SKIN_URL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";
const HAIR = 1, BODY = 2, FACE = 3;
const CONF = 0.25;          // below this the model starts seeing "people" in menu icons
const IOU = 0.6;             // overlapping people in a crowd are two people, not one
const FALLBACK_BELOW = 0.08; // skin found as a share of the person: under this, cover whole

const $ = id => document.getElementById(id);
const status = t => { $("status").textContent = t; };
let yolo = null, segmenter = null, queue = [], working = false, results = [];

/* ---- load ------------------------------------------------------------- */
async function boot(){
  try{
    ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
    let backend = "webgpu";
    try{ yolo = await ort.InferenceSession.create(YOLO_URL, { executionProviders: ["webgpu"] }); }
    catch(e){ backend = "wasm"; yolo = await ort.InferenceSession.create(YOLO_URL, { executionProviders: ["wasm"] }); }

    const files = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
    let delegate = "GPU";
    try{
      segmenter = await ImageSegmenter.createFromOptions(files, {
        baseOptions: { modelAssetPath: SKIN_URL, delegate }, runningMode: "IMAGE", outputCategoryMask: true });
    }catch(e){
      delegate = "CPU";
      segmenter = await ImageSegmenter.createFromOptions(files, {
        baseOptions: { modelAssetPath: SKIN_URL, delegate }, runningMode: "IMAGE", outputCategoryMask: true });
    }
    status("Ready — people on " + (backend === "webgpu" ? "the graphics card" : "the processor")
           + ", skin on " + (delegate === "GPU" ? "the graphics card" : "the processor") + ".");
  }catch(e){ status("The detectors could not load: " + e.message); }
}

/* ---- people: YOLO ------------------------------------------------------ */
/* Returns [{x1,y1,x2,y2, mask:Uint8Array(w*h)}] at image size. The model
   sees a letterboxed square; 640 for ordinary photos, 1280 when the image is
   large and may hold small figures — it is 4x the work, so only when needed. */
async function findPeople(img, w, h){
  const size = Math.max(w, h) > 1400 ? 1280 : 640;
  const scale = size / Math.max(w, h);
  const nw = Math.round(w * scale), nh = Math.round(h * scale);
  const c = document.createElement("canvas"); c.width = size; c.height = size;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#727272"; ctx.fillRect(0, 0, size, size);       // YOLO's letterbox grey
  ctx.drawImage(img, 0, 0, nw, nh);
  const px = ctx.getImageData(0, 0, size, size).data;
  const input = new Float32Array(3 * size * size);
  for(let i = 0, n = size * size; i < n; i++){
    input[i] = px[i*4] / 255; input[n + i] = px[i*4+1] / 255; input[2*n + i] = px[i*4+2] / 255;
  }
  const out = await yolo.run({ images: new ort.Tensor("float32", input, [1, 3, size, size]) });
  const det = out.output0;               // [1, 116, N]  4 box + 80 classes + 32 mask coeffs
  const proto = out.output1;             // [1, 32, mh, mw]
  const N = det.dims[2], d = det.data;
  const mh = proto.dims[2], mw = proto.dims[3], pd = proto.data;

  // person is class 0 -> row 4
  const cands = [];
  for(let i = 0; i < N; i++){
    const score = d[4 * N + i];
    if(score < CONF) continue;
    const cx = d[i], cy = d[N + i], bw = d[2*N + i], bh = d[3*N + i];
    const coef = new Float32Array(32);
    for(let k = 0; k < 32; k++) coef[k] = d[(84 + k) * N + i];
    cands.push({ score, x1: cx - bw/2, y1: cy - bh/2, x2: cx + bw/2, y2: cy + bh/2, coef });
  }
  cands.sort((a, b) => b.score - a.score);
  const kept = [];
  for(const a of cands){
    let dup = false;
    for(const b of kept){
      const ix = Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1));
      const iy = Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
      const inter = ix * iy, ua = (a.x2-a.x1)*(a.y2-a.y1) + (b.x2-b.x1)*(b.y2-b.y1) - inter;
      if(inter / ua > IOU){ dup = true; break; }
    }
    if(!dup) kept.push(a);
  }

  // each mask = sigmoid(coef · prototypes), inside its box, back at image size
  const people = [];
  const ps = mw / size;                 // prototype grid per letterbox pixel
  for(const b of kept){
    const mask = new Uint8Array(w * h);
    const bx1 = Math.max(0, b.x1), by1 = Math.max(0, b.y1), bx2 = Math.min(nw, b.x2), by2 = Math.min(nh, b.y2);
    const ix1 = Math.max(0, Math.floor(bx1 / scale)), iy1 = Math.max(0, Math.floor(by1 / scale));
    const ix2 = Math.min(w, Math.ceil(bx2 / scale)), iy2 = Math.min(h, Math.ceil(by2 / scale));
    for(let y = iy1; y < iy2; y++){
      const gy = Math.min(mh - 1, Math.floor(y * scale * ps));
      for(let x = ix1; x < ix2; x++){
        const gx = Math.min(mw - 1, Math.floor(x * scale * ps));
        let v = 0;
        for(let k = 0; k < 32; k++) v += b.coef[k] * pd[k * mh * mw + gy * mw + gx];
        if(v > 0) mask[y * w + x] = 1;          // sigmoid(v) > 0.5  <=>  v > 0
      }
    }
    people.push({ x1: ix1, y1: iy1, x2: ix2, y2: iy2, mask });
  }
  return people;
}

/* ---- skin inside one person: MediaPipe ---------------------------------- */
function skinInside(img, w, h, p, hair){
  const pad = 0.12;
  const bw = p.x2 - p.x1, bh = p.y2 - p.y1;
  const x1 = Math.max(0, Math.floor(p.x1 - pad*bw)), x2 = Math.min(w, Math.ceil(p.x2 + pad*bw));
  const y1 = Math.max(0, Math.floor(p.y1 - pad*bh)), y2 = Math.min(h, Math.ceil(p.y2 + pad*bh));
  const cw = x2 - x1, ch = y2 - y1;
  const mask = new Uint8Array(w * h);
  if(cw < 8 || ch < 8) return mask;
  const s = 512 / Math.max(cw, ch);
  const c = document.createElement("canvas"); c.width = 512; c.height = 512;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 512, 512);
  ctx.drawImage(img, x1, y1, cw, ch, 0, 0, Math.round(cw*s), Math.round(ch*s));
  const out = segmenter.segment(c);
  const cat = out.categoryMask.getAsUint8Array(), mw = out.categoryMask.width, mhh = out.categoryMask.height;
  out.close();
  for(let yy = 0; yy < ch; yy++){
    const my = Math.min(mhh-1, Math.floor(yy * s * mhh / 512));
    for(let xx = 0; xx < cw; xx++){
      const mx = Math.min(mw-1, Math.floor(xx * s * mw / 512));
      const k = cat[my * mw + mx];
      const i = (y1 + yy) * w + (x1 + xx);
      if((k === BODY || k === FACE || (hair && k === HAIR)) && p.mask[i]) mask[i] = 1;
    }
  }
  return mask;
}

/* ---- grow, cover -------------------------------------------------------- */
function dilate(mask, w, h, r){
  if(r <= 0) return mask;
  const tmp = new Uint8Array(w*h), out = new Uint8Array(w*h);
  for(let y = 0; y < h; y++){ let run = 0;
    for(let x = 0; x < w + r; x++){ if(x < w && mask[y*w+x]) run = 2*r+1;
      if(run > 0 && x-r >= 0 && x-r < w) tmp[y*w+(x-r)] = 1; if(run > 0) run--; } }
  for(let x = 0; x < w; x++){ let run = 0;
    for(let y = 0; y < h + r; y++){ if(y < h && tmp[y*w+x]) run = 2*r+1;
      if(run > 0 && y-r >= 0 && y-r < h) out[(y-r)*w+x] = 1; if(run > 0) run--; } }
  return out;
}

function cover(img, w, h, mask, style){
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const src = ctx.getImageData(0, 0, w, h);
  let alt = null;
  if(style !== "solid"){
    const t = document.createElement("canvas"); t.width = w; t.height = h;
    const tc = t.getContext("2d");
    if(style === "blur"){ tc.filter = "blur(" + Math.max(12, Math.round(w/40)) + "px)"; tc.drawImage(img, 0, 0, w, h); }
    else{ const bk = Math.max(10, Math.round(w/45)); tc.imageSmoothingEnabled = false;
          tc.drawImage(img, 0, 0, w, h, 0, 0, Math.ceil(w/bk), Math.ceil(h/bk));
          tc.drawImage(t, 0, 0, Math.ceil(w/bk), Math.ceil(h/bk), 0, 0, w, h); }
    alt = tc.getImageData(0, 0, w, h).data;
  }
  const d = src.data;
  for(let i = 0; i < w*h; i++){
    if(!mask[i]) continue;
    if(alt){ d[i*4] = alt[i*4]; d[i*4+1] = alt[i*4+1]; d[i*4+2] = alt[i*4+2]; }
    else{ d[i*4] = 38; d[i*4+1] = 40; d[i*4+2] = 52; }
  }
  ctx.putImageData(src, 0, 0);
  return c;
}

/* ---- one file ------------------------------------------------------------ */
async function processFile(file){
  const url = URL.createObjectURL(file);
  const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
  const scale = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const hair = $("opt-hair").checked, grow = Number($("opt-grow").value);
  const began = performance.now();

  const people = await findPeople(img, w, h);
  let mask = new Uint8Array(w * h), whole = 0;
  for(const p of people){
    let m = p.mask;
    if(mode === "skin"){
      const sk = skinInside(img, w, h, p, hair);
      let ps = 0, ss = 0;
      for(let i = 0; i < w*h; i++){ ps += p.mask[i]; ss += sk[i]; }
      if(ss < FALLBACK_BELOW * ps){ whole++; }         // skin model saw nothing — keep the outline
      else m = sk;
    }
    for(let i = 0; i < w*h; i++) if(m[i]) mask[i] = 1;
  }
  mask = dilate(mask, w, h, grow);
  let covered = 0; for(let i = 0; i < mask.length; i++) covered += mask[i];
  const out = cover(img, w, h, mask, $("opt-style").value);
  URL.revokeObjectURL(url);
  return { canvas: out, ms: Math.round(performance.now() - began), pct: Math.round(100*covered/mask.length),
           people: people.length, whole, name: file.name };
}

/* ---- queue -------------------------------------------------------------- */
function addFiles(list){
  for(const f of list){
    if(!f.type.startsWith("image/")) continue;
    const card = document.createElement("div"); card.className = "card busy";
    card.innerHTML = '<div style="aspect-ratio:4/3;background:var(--surface2);"></div>'
      + '<div class="meta"><span>' + esc(f.name) + '</span><b>waiting</b></div>';
    $("grid").prepend(card); queue.push({ file: f, card });
  }
  pump();
}
async function pump(){
  if(working) return; working = true;
  while(queue.length){
    const { file, card } = queue.shift();
    if(!yolo || !segmenter){ card.querySelector("b").textContent = "detectors not loaded"; card.className = "card fail"; continue; }
    card.querySelector("b").textContent = "covering…";
    try{
      const r = await processFile(file);
      card.replaceChild(r.canvas, card.firstChild);
      card.querySelector("b").textContent = r.people + (r.people === 1 ? " person" : " people")
        + (r.whole ? " (" + r.whole + " whole)" : "") + " · " + r.pct + "% · " + r.ms + " ms";
      card.className = "card done"; results.push(r); autoDownload(r);
    }catch(e){ card.querySelector("b").textContent = "failed: " + e.message; card.className = "card fail"; }
    status(results.length + " done" + (queue.length ? ", " + queue.length + " waiting" : ""));
  }
  $("dl-all").disabled = results.length === 0; working = false;
}
function autoDownload(r){
  r.canvas.toBlob(blob => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = r.name.replace(/\.[^.]+$/, "") + "-covered.jpg"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, "image/jpeg", 0.92);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("files").addEventListener("change", e => addFiles(e.target.files));
$("drop").addEventListener("dragover", e => { e.preventDefault(); $("drop").classList.add("over"); });
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("over"));
$("drop").addEventListener("drop", e => { e.preventDefault(); $("drop").classList.remove("over"); addFiles(e.dataTransfer.files); });
document.addEventListener("paste", e => { if(e.clipboardData?.files?.length) addFiles(e.clipboardData.files); });
$("opt-grow").addEventListener("input", e => { $("grow-v").textContent = e.target.value; });
$("clear").addEventListener("click", () => { $("grid").innerHTML = ""; results = []; $("dl-all").disabled = true; });
$("dl-all").addEventListener("click", () => results.forEach(autoDownload));
boot();
</script>
</body>
</html>
